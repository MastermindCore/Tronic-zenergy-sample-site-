<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Tronic Zenergy</title>
<meta name="theme-color" content="#070b12">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="12" fill="#121B2B"/><path d="M34 10 L18 35 H29 L24 54 L46 27 H34 L40 10 Z" stroke="#2F8FFF" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
      Tronic Zenergy
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="classes.html">Classes</a></li>
    </ul>
    <div class="nav-actions">
      <a class="btn btn-primary" href="signup.html">Sign up</a>
    </div>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">Menu</button>
  </div>
</nav>

<div class="auth-shell">
  <span class="kicker" style="display:block;color:var(--cyan);font-size:0.86rem;font-weight:600;margin-bottom:10px">Welcome back</span>
  <h1 style="margin-bottom:24px">Log in</h1>

  <div class="form-error" id="form-error"></div>

  <form id="login-form">
    <div class="form-field">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="form-field">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>

  <p style="margin-top:16px;font-size:0.88rem"><a href="#" id="reset-link" style="color:var(--gray)">Forgot your password?</a></p>
  <p style="margin-top:12px;font-size:0.9rem;color:var(--gray)">No account yet? <a href="signup.html" style="color:var(--electric)">Sign up</a></p>
</div>

<script src="js/firebase-config.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errBox = document.getElementById("form-error");
    errBox.classList.remove("show");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    try {
      await window.TZ_AUTH.tzLogIn(email, password);
      window.location.href = "dashboard.html";
    } catch (err) {
      errBox.textContent = err.message || "Could not log in. Check your details and try again.";
      errBox.classList.add("show");
    }
  });

  document.getElementById("reset-link").addEventListener("click", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    if (!email) { alert("Enter your email above first, then click this link again."); return; }
    try {
      const msg = await window.TZ_AUTH.tzResetPassword(email);
      alert(msg);
    } catch (err) {
      alert(err.message || "Could not send a reset email.");
    }
  });
</script>
</body>
</html>
